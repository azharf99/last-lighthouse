[package]
name = "last-lighthouse-desktop"
version = "0.1.0"
description = "The Last Lighthouse Desktop Client"
authors = ["Last Lighthouse Team"]
edition = "2021"

[lib]
name = "last_lighthouse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
tauri-plugin-shell = "2.0.0-rc"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
